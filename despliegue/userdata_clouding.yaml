#cloud-config
# Primer arranque del servidor de EvA. Deja la máquina cerrada ANTES de que
# nadie pueda tocarla: un servidor público con acceso por contraseña empieza
# a recibir intentos de fuerza bruta a los pocos minutos de existir.

package_update: true
package_upgrade: true

packages:
  - python3-venv
  - python3-pip
  - git
  - nginx
  - ufw
  - fail2ban
  - sqlite3
  - unattended-upgrades

users:
  # La aplicación no corre como root: si algún día la comprometen, que el
  # atacante se encuentre con una cuenta sin permisos, no con la máquina.
  - name: eva
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHduxqESWV4Wxuke9/cU9Qdxg8L66FC5e+vY6eON6SOs claude-code@windows

write_files:
  # Parches de seguridad automáticos: es lo que evita que el servidor se
  # quede viejo y agujereado si nadie lo mira en tres meses.
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # Nadie entra con contraseña, ni siquiera root. Solo con clave.
  - sed -i 's/^#*PasswordAuthentication.*/PasswordAuthentication no/' /etc/ssh/sshd_config
  - sed -i 's/^#*PermitRootLogin.*/PermitRootLogin no/' /etc/ssh/sshd_config
  - sed -i 's/^#*KbdInteractiveAuthentication.*/KbdInteractiveAuthentication no/' /etc/ssh/sshd_config
  - rm -f /etc/ssh/sshd_config.d/*cloudimg*
  - systemctl restart ssh || systemctl restart sshd

  # Solo se abre lo que hace falta: SSH y la web.
  - ufw allow OpenSSH
  - ufw allow 'Nginx Full'
  - ufw --force enable

  - systemctl enable --now fail2ban
  - systemctl enable --now nginx
