server {
    listen 80;
    server_name 7c0cdce9-a46a-4339-9df6-50a26f00f11c.clouding.host;

    # Los vuelos que suben los pilotos pueden ser grandes; 20 MB da margen de
    # sobra (uno típico ocupa 15 KB).
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sin esto EvA cree que va por HTTP y la cookie segura no viaja.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
