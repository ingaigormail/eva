# Perfiles de aeronave de la flota de EvA.
#
# ─────────────────────────────────────────────────────────────────────────
#  REGLA INNEGOCIABLE DE ESTE FICHERO
#
#  Ningun valor se rellena de memoria, por estimacion ni por parecido con
#  otro avion.  `null` significa "todavia no verificado", y el motor debe
#  tratarlo como "esta regla NO se evalua" --nunca como cero ni como
#  "sin limite".
#
#  Una V-speed inventada no produce un aviso: produce una penalizacion a un
#  piloto que volaba bien.  Es peor que no evaluar.
# ─────────────────────────────────────────────────────────────────────────
#
# DOS FUENTES, DOS CLASES DE REGLA -- no mezclar
# ----------------------------------------------
#
#   `limites_poh`      Limites certificados del manual del avion (POH).
#                      Son LIMITES: excederlos es una infraccion objetiva.
#                      VFE, VLE, VMCA, VNE, VNO, VA, VMO, MMO.
#                      >> NINGUNA de estas la publica EUROCONTROL. <<
#                      Solo pueden salir del POH.
#
#   `referencia_atc`   Valores TIPICOS de operacion, de la Aircraft
#                      Performance Database de EUROCONTROL.
#                      NO son limites: son lo que el avion suele hacer.
#                      Sirven para reglas de DESVIACION ("ascendiste mucho
#                      mas despacio de lo normal"), nunca de infraccion.
#
#   Confundirlas seria un error grave: volar a 70 kt en aproximacion cuando
#   el valor tipico es 65 kt NO es una infraccion.  Superar VFE SI lo es.
#
# Fuente de `referencia_atc`:
#   https://learningzone.eurocontrol.int/ilp/customs/ATCPFDB/details.aspx?ICAO=<designador>
#   Gratuita y sin registro.  Verificada el 2026-08-16.
#   Campos que ofrece: V2, Vat, IAS/ROC de ascenso por tramo, TAS y Mach de
#   crucero, IAS/ROD de descenso y aproximacion, MTOW, distancias de
#   despegue y aterrizaje, estela, APC, planta motriz.
#   Campos que NO ofrece: VFE, VLE, VNE, VNO, VA, VMCA, VMO, MMO.
#
# Aplicabilidad
# -------------
#   `no_aplica` = esa velocidad no existe en este avion (p.ej. VLE con tren
#   fijo, VMCA en monomotor).  Distinto de `null` = falta verificarlo.
#   El motor trata ambos igual (no evalua), pero el informe de cobertura
#   solo debe reclamar los `null`.
#
# Nota sobre peso: `referencia_atc` da UN valor por avion, sin tablas.
# V2, VREF y VA dependen del peso.  Ver DAT-06 en la especificacion.


