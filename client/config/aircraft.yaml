    fecha_consulta: 2026-08-16
    mtow_kg: 3354
    mtow_lbs: 7394
    vr_por_peso:
      # Leido de un nomograma (grafico de escalas), NO de una tabla.
      # La lectura tiene precision limitada: usar solo como orden de
      # magnitud hasta contrastar con el POH.
      formato: nomograma
      rango_vr_kt: [75, 90]
      rango_peso_kg: [2200, 3354]
      nota: >-
        VR varia unos 15 kt a lo largo del rango de pesos. Un valor unico
        se equivocaria hasta en +-7 kt. Confirma DAT-06.
  notas: >-
    Sin registro en EUROCONTROL y sin POH. Lo unico disponible hoy es un
    checklist de simulador que aporta MTOW y VR por peso. Ni VMO, ni VFE,
    ni VLE, ni VNE, ni VREF.


