DHC6:
  nombre: De Havilland Canada DHC-6 Twin Otter
  designador:
    verificado: true
    fuente: eurocontrol_apdb
  configuracion:
    tren: fijo              # verificar la variante de la flota
    motores: 2
    turbina: true
  limites_poh:
    fuente: >-
      MSFS 2024 DHC-6 Twin Otter Aircraft Operating Manual, pag. 42 y 46.
      flightsimulator.com/aircraft-manuals/
    revisado_por: claude
    fecha: 2026-08-16
    unidad: KIAS
    nota_cas_ias: >-
      El manual da CAS e IAS en columnas separadas. Aqui se usa SIEMPRE la
      columna IAS, porque es lo que reporta el simulador y lo que graba EvA
      en `ias_kt`. Usar la de CAS penalizaria de mas por unos pocos nudos.
    vso: null              # el AOM no publica la velocidad de perdida
    vs1: null
    vfe: 103               # flaps 10 grados
    vfe_por_flap:
      10: 103
      37.5: 93             # de flaps 10 a 37,5 grados
    vle: no_aplica
    vlo: no_aplica
    vmca: 64               # con flaps 10 grados
    vyse: null
    va: 132                # el manual la llama VP, hasta 18.000 ft
    vb_racha: 132          # penetracion de turbulencia, hasta 18.000 ft
    vno: null
    vne: null              # el AOM solo publica VNE para la version con esquis
    vmo: 166               # a nivel del mar; varia con la altitud, ver abajo
    vmo_por_altitud_ft:
      0: 166               # hasta 6.700 ft
      10000: 156
      15000: 141
      20000: 126
      25000: 112
    mmo: no_aplica
    vr: null
    vx: 87                 # flaps 0
    vy: 100                # flaps 0
  variantes:
    # Se confirma lo que se sospechaba: la version importa y cambia limites.
    flotadores:
      vmo_kt: 160          # el manual lo da junto a la cifra CAS; verificar
      nota: "comprobar si 160 es CAS o IAS antes de usarlo"
    esquis:
      vne_kt: 178          # IAS, del nivel del mar a 10.000 ft
      vne_reduccion: "restar 4 kt por cada 1.000 ft por encima de 10.000 ft"
      nota: "tambien cambian los limites de centrado"
  referencia_atc:
    v2_kt: 80
    vat_kt: 70
    mtow_kg: 5670
    ascenso_inicial_ias_kt: null
    ascenso_inicial_roc_fpm: null
    crucero_tas_kt: null
    descenso_ias_kt: null
    aproximacion_ias_kt: null
  notas: >-
    Confirmar variante: tren, flotadores o esquis cambian limites y hacen
    que `tren: fijo` pueda no ser cierto en la version de la flota.


C25C:
  nombre: Cessna Citation CJ4
  designador:
    verificado: true
    fuente: eurocontrol_apdb
    nota: "en la BD figura como '525C Citation CJ4 by Cessna'; IATA CNJ"
  configuracion:
    tren: retractil
    motores: 2
    turbina: true
    reactor: true
  limites_poh:
    fuente: >-
      MSFS Cessna Citation CJ4 Operator's Guide v1, seccion 2 "Limitations",
      pag. 5. flightsimulator.com/aircraft-manuals/
    revisado_por: claude
    fecha: 2026-08-16
    unidad: KIAS
    vso: null              # el manual no publica la cifra, solo la usa
    vs1: null
    vfe: null              # usar el mapa por escalon de flap
    vfe_por_flap:
      15: 200
      35: 160
    vle: 200
    vlo: null
    vmca: null
    va: null
    # VMO cambia por tramos de altitud: por debajo de 8.000 ft el limite es
    # mas bajo (el manual lo llama VMN). Aplicar el tramo que corresponda.
    vmo: 305               # entre 8.000 y 27.884 ft
    vmo_por_altitud_ft:
      0: 260               # por debajo de 8.000 ft (VMN)
      8000: 305            # hasta 27.884 ft; por encima manda MMO
    mmo: 0.77              # por encima de 27.884 ft. Es Mach, NO nudos
    velocidad_minima_engelamiento: 160
    v1: null               # depende de peso, pista, altitud y temperatura
    vr: null
    vx: null
    vy: null
  pesos:
    # Del mismo manual. El MTOW coincide con el de EUROCONTROL (7.761 kg):
    # dos fuentes independientes de acuerdo.
    max_rampa_lb: 17230
    mtow_lb: 17110
    max_aterrizaje_lb: 15660
    max_sin_combustible_lb: 12500
  viento:
    max_viento_cola_aterrizaje_kt: 10
    max_viento_cruzado_demostrado_kt: 25
  referencia_atc:
    v2_kt: 116
    vat_kt: 110
    mtow_kg: 7761
    ascenso_inicial_ias_kt: 200
    ascenso_inicial_roc_fpm: 3500
    ascenso_fl150_ias_kt: 240
    ascenso_fl150_roc_fpm: 3500
    ascenso_fl240_ias_kt: 240
    ascenso_fl240_roc_fpm: 2500
    ascenso_mach: 0.64
    crucero_tas_kt: 450
    crucero_mach: 0.74
    techo_fl: 450
    alcance_nm: 1920
    descenso_fl240_mach: 0.74
    descenso_fl240_rod_fpm: 2000
    descenso_fl100_ias_kt: 290
    descenso_fl100_rod_fpm: 2000
    aproximacion_ias_kt: 200
    aproximacion_rod_fpm: 1500
    aproximacion_mcs_kt: 140
    distancia_despegue_m: 1039
    distancia_aterrizaje_m: 896
    estela: M
    apc: B
  notas: >-
    VREF no es un numero fijo: el manual lo define como 1,3 x VSO para el
    peso del momento, y VAPP como VREF + 7 kt. Los calcula la aviónica. Sin
    la VSO publicada no se puede reproducir, asi que VREF queda sin valor
    aunque ahora se conozca la regla que lo gobierna. Confirma DAT-06.
    V1, VR y V2 dependen ademas de pista, altitud y temperatura; el valor
    unico de `referencia_atc` es referencia tipica, NO umbral de evaluacion.
