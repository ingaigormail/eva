# Perfiles de operacion TIPICA por nivel de vuelo, para la flota de EvA.
#
# ─────────────────────────────────────────────────────────────────────────
#  ESTO NO SON LIMITES.  Son valores tipicos de operacion usados por ATC
#  para predecir trayectorias.  Alimentan reglas de DESVIACION
#  ("ascendiste mucho mas despacio de lo normal"), nunca de infraccion.
#  Los limites (VFE, VLE, VNE, VNO, VA, VMCA, VMO) viven en aircraft.yaml,
#  bloque `limites_poh`, y solo pueden salir del manual del avion.
# ─────────────────────────────────────────────────────────────────────────
#
# Fuente
# ------
#   https://github.com/vatsimnetwork/euroscope-performance-data
#   Fichero AircraftPerformance.txt, licencia MIT (redistribuible).
#   Mantenido por la comunidad de VATSIM para EuroScope v3.2.7.
#   Extraido el 2026-08-16.
#
# Por que importa que sea de VATSIM: los designadores que usa este fichero
# son los que maneja la red.  Confirma `DA62` y `TBM9`, que la Aircraft
# Performance Database de EUROCONTROL no tenia.
#
# Campos (del formato PERFLINE de EuroScope)
#   fl        nivel de vuelo
#   clb/crz/des   velocidad IAS de ascenso / crucero / descenso, en nudos
#   mach_*    numero de Mach cuando sustituye a la IAS (0 = no aplica)
#   roc/rod   regimen de ascenso / descenso, en pies por minuto
#
# ADVERTENCIAS DE CALIDAD -- leer antes de usar
# ---------------------------------------------
# 1. DHC6 aparece DUPLICADO en el fichero de origen, con cifras que se
#    contradicen (135 kt vs 80 kt de ascenso a FL030). Se conservan las dos
#    variantes sin elegir: hay que resolverlo antes de evaluar ese avion.
# 2. DA62 trae filas de FL250 a FL400 con roc 0 y rod 300. Un bimotor de
#    piston no opera ahi: son relleno del formato, no datos. Ignorar por
#    encima de su techo real.
# 3. C172 a FL100 con crucero 140 kt es optimista para el avion real.
#    Recordatorio de que esto es prediccion de trayectoria, no rendimiento
#    certificado.
#
# Regla de uso: si una fila parece imposible para el avion, lo es. Estos
# datos sirven para detectar desviaciones groseras, no para afinar.


