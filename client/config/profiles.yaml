# Perfiles de dificultad para la evaluacion de vuelos VFR.
# Ver ../../docs/criterios_vfr.md para el significado y la justificacion de
# cada regla. "normal" son los valores por defecto documentados alli.
#
# Los perfiles nunca se hardcodean en el motor de evaluacion (avcars/evaluation/
# scoring.py): siempre se leen de aqui, para poder hacerlos mas faciles o mas
# dificiles sin tocar codigo.

normal:
  pass_score: 70
  runway_alignment_deg_max: 10
  touchdown_zone_m_max: 600
  # IAS objetivo en la estabilización queda pendiente: requiere una velocidad
  # de referencia por avión (perfiles POH), que se deja para una fase futura.
  stabilization:
    alt_agl_ft: 500
    alt_agl_tolerance_ft: 100
    vs_fpm_min: -1000
    vs_fpm_max: 0
  landing_vs_bands:
    butter: {max_fpm: 60, points: 0}
    smooth: {max_fpm: 180, points: 0}
    normal: {max_fpm: 300, points: 10}
    hard: {max_fpm: 600, points: 25}
    # por encima de hard.max_fpm (en valor absoluto) => FAIL automatico (very_hard)
  fuel_reserve_kg_min: 20
  pause_duration_s_max: 120
  qnh:
    min_inhg: 28.5
    max_inhg: 31.2
  bank_angle:
    warn_deg: 30
    fail_deg: 60
    sustained_samples: 3
  lights:
    check_tolerance_s: 30
  # Invasion de zonas P, R, D y de prohibicion VFR (datos de ENAIRE).
  # margen_nm: cuanto hay que estar metido para que cuente; los limites
  #   publicados y los del simulador no coinciden al metro.
  # permanencia_s: cuanto tiempo seguido; cruzar un pico no es entrar.
  # muestras_minimas: con un solo punto no se sabe si entro o solo paso.
  airspace:
    margen_nm: 0.5
    permanencia_s: 20
    muestras_minimas: 2
    penalizacion_maxima: 40
  penalties:
    runway_alignment_takeoff: 10
    runway_alignment_landing: 15
    not_stabilized_500ft: 20
    touchdown_zone_exceeded: 10
    fuel_below_reserve: 20
    pause_exceeded: 10
    sustained_bank_angle: 15
    qnh_out_of_range: 10
    gear_up_touchdown: 15
    landing_light_off: 10
    beacon_off_airborne: 10
    nav_light_off_airborne: 10
    taxi_light_off: 5
    strobe_wrong_state: 5
    transponder_off_airborne: 5
    airspace_intrusion: 15

