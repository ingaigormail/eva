<svg viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Avión azul -->
  <path d="M 80 120 L 200 80 L 220 140 Z" fill="#0ea5e9" stroke="none"/>

  <!-- Cono gris -->
  <path d="M 200 80 L 240 200 L 220 140 Z" fill="#9ca3af" stroke="none"/>

  <!-- Estrellas grises -->
  <g fill="#9ca3af">
    <!-- Estrella grande -->
    <polygon points="130,180 140,205 167,205 145,222 155,247 130,230 105,247 115,222 93,205 120,205"/>
    <!-- Estrella mediana -->
    <polygon points="110,145 117,162 136,162 121,173 128,190 110,179 92,190 99,173 84,162 103,162"/>
    <!-- Estrella pequeña -->
    <polygon points="140,130 145,142 158,142 148,150 153,162 140,154 127,162 132,150 122,142 135,142"/>
  </g>

  <!-- Texto: EVA en azul oscuro (var azul-oscuro de eva.css) -->
  <text x="250" y="210" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="#1e3a8a">EvA</text>

  <!-- Texto: Airliner en azul -->
  <text x="520" y="210" font-family="Arial, sans-serif" font-size="110" font-weight="bold" fill="#0ea5e9">Airliner</text>

  <!-- Línea de vuelo con avión pequeño -->
  <path d="M 600 90 Q 650 70 700 85" stroke="#0ea5e9" stroke-width="3" fill="none" stroke-dasharray="5,5"/>
  <g transform="translate(700, 85)">
    <path d="M 0 0 L -15 -8 L -12 0 Z" fill="#0ea5e9"/>
  </g>
</svg>
